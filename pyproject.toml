[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-lab8"
version = "1.0.0"
description = "МТП, лабораторная работа №8, вариант 3"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mtp-lab8 = "mtp_lab8.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
